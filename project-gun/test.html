<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Project Gun · Runtime Test</title>
    <style>
      html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#07090d}
      #status{position:fixed;z-index:2;right:12px;top:12px;padding:8px 11px;background:#090d12dc;border:1px solid #ffffff24;color:#edf0e8;font:12px/1.4 monospace;pointer-events:none}
      #status.ok{border-color:#66e3ee;color:#66e3ee}#status.error{border-color:#ff5b35;color:#ff7658}
    </style>
  </head>
  <body>
    <div id="status">BOOT KONTROL EDİLİYOR…</div>
    <iframe id="game" src="index.html" title="Project Gun test sahnesi"></iframe>
    <script>
      const frame=document.getElementById("game"),status=document.getElementById("status");
      frame.addEventListener("load",()=>setTimeout(()=>{
        const body=frame.contentDocument?.body,error=body?.dataset.gameError,runtime=frame.contentWindow?.__PROJECT_GUN__,assetsReady=runtime?.state?.assetsReady,rigs=runtime?.getViewModelDiagnostics?.()||[];
        const slotsReady=rigs.length===5&&rigs.every(rig=>rig.kind==="knife"?rig.fallbackWeaponVisible:rig.weaponVerified||rig.fallbackWeaponVisible);
        window.projectGunTestReport={gameReady:body?.dataset.gameReady==="true",assetsReady:Boolean(assetsReady),slotsReady,quality:runtime?.state?.quality,rigs,error:error||null};
        status.textContent=error?`HATA · ${error}`:body?.dataset.gameReady&&assetsReady&&slotsReady?`RUNTIME + 5 SLOT HAZIR · ${runtime.state.quality.toUpperCase()} · MANUEL INPUT TESTİ AÇIK`:body?.dataset.gameReady?"RUNTIME HAZIR · MODEL/FALLBACK KONTROLÜ BAŞARISIZ":"BOOT ZAMAN AŞIMI";
        status.className=error||!body?.dataset.gameReady||!slotsReady?"error":"ok";
      },6000));
    </script>
  </body>
</html>
