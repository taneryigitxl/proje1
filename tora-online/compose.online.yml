services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tora_online
    volumes:
      - tora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tora -d tora_online"]
      interval: 5s
      timeout: 3s
      retries: 12

  game:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tora:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/tora_online
      GAME_SERVER_PORT: 8080
      ALLOWED_ORIGINS: https://yigittaner.online
      NODE_ENV: production
      TRUST_LOOPBACK_PROXY: "true"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3

volumes:
  tora_postgres:
