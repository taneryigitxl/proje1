<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TORA — a browser-based 2D fantasy MMORPG." />
    <title>TORA</title>
    <link rel="icon" href="/tora/assets/favicon.png" />
    <script type="module" crossorigin src="/tora/static/index-7w_5EqJW.js"></script>
    <link rel="stylesheet" crossorigin href="/tora/static/index-lJyYm4Se.css">
  </head>
  <body>
    <div id="app">
      <div id="game-root"></div>
      <div id="nameplate-layer"></div>

      <div id="hud" hidden>
        <header class="player-card">
          <canvas id="hud-portrait" width="48" height="72" aria-hidden="true"></canvas>
          <div>
            <strong id="hud-name">Gezgin</strong>
            <span id="hud-level">Seviye 1</span>
            <div class="bars" aria-label="Can ve mana">
              <div class="bar hp"><span id="hp-fill"></span><b id="hp-text">100 / 100</b></div>
              <div class="bar mp"><span id="mp-fill"></span><b id="mp-text">50 / 50</b></div>
            </div>
          </div>
        </header>

        <aside class="minimap-panel">
          <canvas id="minimap" width="168" height="112" aria-label="Küçük harita"></canvas>
          <span id="online-count">1 çevrimiçi</span>
        </aside>

        <section class="chat-panel" aria-label="Sohbet">
          <div class="chat-tabs">
            <button type="button" class="active">Genel</button>
            <button type="button">Yakın</button>
            <button type="button" disabled>Grup</button>
            <button type="button" disabled>Lonca</button>
            <button type="button" disabled>Özel</button>
            <button type="button" disabled>Sistem</button>
          </div>
          <div id="chat-log"></div>
          <form id="chat-form">
            <input id="chat-input" maxlength="180" autocomplete="off" placeholder="Bir şey yaz…  /say" />
          </form>
        </section>

        <footer class="hotbar" aria-label="Kısayol çubuğu">
          <div data-slot="1">1</div>
          <div data-slot="2">2</div>
          <div data-slot="3">3</div>
          <div data-slot="4">4</div>
          <div data-slot="5">5</div>
          <div data-slot="6">6</div>
          <div data-slot="7">7</div>
          <div data-slot="8">8</div>
          <div data-slot="9">9</div>
        </footer>

        <div class="gold-panel"><i></i><span>Altın</span><b id="gold-text">0</b></div>
        <nav class="menu-bar" aria-label="Menü">
          <button type="button" data-panel="character">Karakter</button>
          <button type="button" data-panel="inventory">Envanter</button>
          <button type="button" data-panel="skills">Yetenekler</button>
          <button type="button" data-panel="quests">Görevler</button>
          <button type="button" data-panel="guild">Lonca</button>
          <button type="button" data-panel="map">Harita</button>
          <button type="button" data-panel="settings">Ayarlar</button>
        </nav>
        <div class="hud-actions">
          <button id="mute-button" type="button">Ses</button>
          <button id="leave-button" type="button">Ayrıl</button>
          <button id="hud-logout" type="button">Çıkış</button>
        </div>
      </div>

      <div id="disconnect" hidden>
        <p id="disconnect-text">Tora dünyasıyla bağlantı kesildi.</p>
        <div>
          <button id="reconnect-button" type="button">Yeniden bağlan</button>
          <button id="disconnect-logout" type="button">Çıkış</button>
        </div>
      </div>

      <section id="auth-screen" class="screen">
        <div class="panel auth-panel">
          <p class="eyebrow">Tora Köyü</p>
          <h1>TORA</h1>
          <p class="lede">Yolların, ocakların ve vahşi yerlerin kalıcı dünyası. Başka yolcular çoktan burada.</p>
          <div class="tabs">
            <button id="show-login" type="button" class="active">Giriş</button>
            <button id="show-register" type="button">Kayıt</button>
          </div>
          <form id="login-form">
            <label>Kullanıcı adı<input name="username" autocomplete="username" required /></label>
            <label>Şifre<input name="password" type="password" autocomplete="current-password" required /></label>
            <button type="submit">Giriş yap</button>
          </form>
          <form id="register-form" hidden>
            <label>Kullanıcı adı<input name="username" autocomplete="username" required /></label>
            <label>E-posta<input name="email" type="email" autocomplete="email" required /></label>
            <label>Şifre<input name="password" type="password" autocomplete="new-password" required /></label>
            <button type="submit">Hesap oluştur</button>
          </form>
          <p id="auth-error" class="form-error" role="alert"></p>
          <button id="admin-test" type="button">Yönetici test modu</button>
        </div>
      </section>

      <section id="character-screen" class="screen" hidden>
        <div class="panel character-panel">
          <p class="eyebrow">Karakter</p>
          <h2 id="character-heading">Yolcunu seç</h2>
          <div id="character-card" hidden>
            <canvas id="select-portrait" width="48" height="72" aria-hidden="true"></canvas>
            <div>
              <strong id="select-name"></strong>
              <span id="select-meta"></span>
            </div>
            <button id="enter-world" type="button">Tora Köyü'ne gir</button>
          </div>
          <form id="create-form">
            <label>İsim<input id="character-name" name="name" maxlength="16" required /></label>
            <fieldset>
              <legend>Cinsiyet</legend>
              <div id="body-options" class="choice-row"></div>
            </fieldset>
            <fieldset>
              <legend>Saç</legend>
              <div id="hair-options" class="choice-row"></div>
            </fieldset>
            <fieldset>
              <legend>Saç rengi</legend>
              <div id="color-options" class="choice-row"></div>
            </fieldset>
            <canvas id="create-portrait" width="48" height="72" aria-hidden="true"></canvas>
            <button type="submit">Karakter oluştur</button>
          </form>
          <p id="character-error" class="form-error" role="alert"></p>
          <button id="character-logout" class="text-button" type="button">Çıkış</button>
        </div>
      </section>
      <div id="panel-layer" hidden></div>
    </div>
  </body>
</html>
