name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser_smoke:
        description: Run the full browser suite before publishing
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tora-online/package-lock.json
      - run: npm ci
        working-directory: tora-online
      - run: npm test && npm run build
        working-directory: tora-online
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'workflow_dispatch' || inputs.browser_smoke
        working-directory: tora-online
      - run: npm run test:browser
        if: github.event_name != 'workflow_dispatch' || inputs.browser_smoke
        working-directory: tora-online
      - name: Build online client when the game API is deployed
        if: vars.TORA_GAME_API_URL != ''
        run: npm run build
        working-directory: tora-online
        env:
          VITE_GAME_API_URL: ${{ vars.TORA_GAME_API_URL }}
      - run: node scripts/package-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
